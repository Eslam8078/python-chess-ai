[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-chess-game"
version = "1.0.0"
description = "A desktop chess game with a minimax AI built with Python and Pygame"
requires-python = ">=3.10"
dependencies = ["pygame>=2.6,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools.packages.find]
include = ["chess_game*"]
